apiVersion: apps/v1
kind: Deployment
metadata:
  name: production-deployment
  namespace: prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: production-design
  template:
    metadata:
      labels:
        app: production-design
    spec:
      containers:
      - name: prod-container
        image: us-central1-docker.pkg.dev/qwiklabs-gcp-00-1e7bd809bcb5/my-repository/sample-app:v1.0
        ports:
        - containerPort: 8080
